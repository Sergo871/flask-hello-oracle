# /etc/nginx/conf.d/flask-hello.conf
# Înlocuiește domeniul cu al tău. Blocul HTTPS (listen 443 ssl + certificatele)
# și redirect-ul http -> https le adaugă automat `certbot --nginx --redirect`.
server {
    listen 80;
    server_name flask-hello-oracle.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
